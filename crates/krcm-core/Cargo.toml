[package]
name = "krcm-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Experimental KRCM-SPN encryption research implementation"

[dependencies]
base64 = "0.22"
hmac = "0.12"
pbkdf2 = "0.12"
rand = "0.8"
rand_core = "0.6"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
scrypt = "0.11"
subtle = "2"
thiserror = "1"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
criterion = "0.5"
hex = "0.4"
proptest = "1"

[[bench]]
name = "krcm_benches"
harness = false
